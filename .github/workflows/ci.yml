name: CI — POLARIS

on:
  push:
  pull_request:

jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: shared/package-lock.json }
      - run: npm i --legacy-peer-deps --prefix shared
      - run: npm --prefix shared test
      - run: npx --prefix shared tsc -p shared/tsconfig.json --noEmit

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: sync-gateway/package-lock.json }
      - run: npm i --legacy-peer-deps --prefix shared
      - run: npm --prefix shared run build
      - run: npm i --legacy-peer-deps --prefix sync-gateway
      - run: npm --prefix sync-gateway test
      - run: npx --prefix sync-gateway tsc -p sync-gateway/tsconfig.json --noEmit

  field:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: field/package-lock.json }
      - run: npm i --legacy-peer-deps --prefix shared
      - run: npm --prefix shared run build
      - run: npm i --legacy-peer-deps --prefix field
      - run: npx --prefix field tsc -p field/tsconfig.json --noEmit
      - run: npm --prefix field run build

  hq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r hq/requirements.txt
      - run: pytest hq/tests -v
      - run: python -m py_compile hq/app/main.py hq/app/db.py hq/app/forecast.py hq/app/config.py
      - name: Check budgets (ONNX <2MB, synthetic CSV exists)
        run: |
          test -f ai/thermo_residual.onnx
          test $(stat -c%s ai/thermo_residual.onnx) -lt 2097152
          test -f ai/training/weather_fuel_history.csv
          test -f ai/scaler.json
          echo "budgets OK"

  hq-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: hq-dashboard/package-lock.json }
      - run: npm i --legacy-peer-deps --prefix shared
      - run: npm --prefix shared run build
      - run: npm i --legacy-peer-deps --prefix hq-dashboard
      - run: npx --prefix hq-dashboard tsc -p hq-dashboard/tsconfig.json --noEmit
      - run: npm --prefix hq-dashboard run build


  chaos:
    runs-on: ubuntu-latest
    needs: [shared, gateway, hq]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: npm i --legacy-peer-deps
      - run: npm --prefix shared run build
      - run: npm --prefix sync-gateway run build
      - run: pip install -r hq/requirements.txt -q
      - run: node scripts/m1_verify.mjs
      - run: node scripts/m2_verify.mjs
      - run: node scripts/m3_verify.mjs
      - run: node scripts/m4_verify.mjs
      - run: node scripts/m5_verify.mjs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 120
      - run: docker compose ps
      - run: curl -f http://localhost:8000/health
      - run: curl -f http://localhost:8787/health
      - run: curl -f http://localhost:3000/api/health || curl -f http://localhost:3000
      - run: curl -f http://localhost:3001/api/health || curl -f http://localhost:3001
      - run: docker compose down -v


