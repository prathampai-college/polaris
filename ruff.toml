# Python lint (CI: `ruff check .`). Catches real bugs — undefined names, unused
# imports/variables, bare except, shadowing — not formatting: this codebase
# deliberately writes compact one-liners and grouped imports.
target-version = "py311"
extend-exclude = ["node_modules", "brag-output", "**/node_modules"]

[lint]
select = ["E4", "E7", "E9", "F", "B006", "B008"]
ignore = ["E401", "E701", "E702", "E731", "E741"]

[lint.per-file-ignores]
# FastAPI's Depends() in defaults is the framework idiom
"hq/app/main.py" = ["B008"]
# tests put the repo root on sys.path before importing the app
"hq/tests/*" = ["E402"]
# training scripts import heavy deps (pandas/onnx) at the step that needs them
"ai/**" = ["E402"]
